# Tiny Tapeout project information
project:
  title:        "bitfield"      # Project title
  author:       "Om Rawaley"      # Your name
  discord:      "crtguy"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Live algorithmic VGA art: 7 bitwise/arithmetic pattern equations (lattice, rings, hyperbola, interference, Sierpinski, weave, tartan) with colour-map palettes, cycling through the gallery"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25175000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_omrawaley_bitfield"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs (all only used when ui[4]=1, manual mode; ui[4]=0 runs the gallery)
  ui[0]: "Manual shift amount bit 0"
  ui[1]: "Manual shift amount bit 1"
  ui[2]: "Manual colour map bit 0 (0 direct, 1 high bits, 2 split, 3 inverted)"
  ui[3]: "Manual colour map bit 1"
  ui[4]: "1 = manual controls, 0 = auto gallery"
  ui[5]: "Manual pattern bit 0 (0 lattice, 1 rings, 2 hyperbola, 3 interference)"
  ui[6]: "Manual pattern bit 1"
  ui[7]: "Manual pattern bit 2 (4 Sierpinski, 5 weave, 6 tartan)"

  # Outputs (Tiny VGA PMOD / VGA playground mapping)
  uo[0]: "VGA R1"
  uo[1]: "VGA G1"
  uo[2]: "VGA B1"
  uo[3]: "VGA VSYNC (active low)"
  uo[4]: "VGA R0"
  uo[5]: "VGA G0"
  uo[6]: "VGA B0"
  uo[7]: "VGA HSYNC (active low)"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
